
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Personal stories and development notes from Gabriel Space."
  >

  <title>Journal | Gabriel Space</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        Gabriel<span class="logo-dot">.</span>Space
        <span>✳</span>
      </a>

      <nav class="nav" id="site-nav">
        <a href="index.html">Home</a>
        <a href="index.html#journal">Journal</a>
        <a href="index.html#about">About</a>
      </nav>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="site-nav"
        aria-expanded="false"
      >
        Menu
      </button>

    </div>
  </header>


  <!-- ARTICLE -->

  <main class="container article-page">

    <a href="index.html#journal" class="back-link">

    </a>

  <!-- FOOTER -->

  <footer class="site-footer">
    <div class="container footer-inner">

      <span>© <span id="year"></span> Gabriel Space</span>
      <span>Made somewhere on planet Earth. 👽</span>

    </div>
  </footer>


  <!-- SCRIPTS -->

<!-- HTML sanitizer -->
